#shaka-container:fullscreen,#shaka-container:-webkit-full-screen,#jw-container:fullscreen,#jw-container:-webkit-full-screen{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;height:100dvh!important;padding:0!important;margin:0!important;background:#000!important;overflow:hidden!important}

.video-fit-btn{position:absolute;top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));z-index:10000;border:1px solid rgba(255,255,255,.28);background:rgba(0,0,0,.68);color:#fff;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:10px;padding:9px 12px;min-width:105px;font-size:12px;font-weight:700;letter-spacing:.3px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}

  <body>
    <main class="player-shell" id="player-shell">
      <div id="shaka-container" class="engine-container">
        <video id="shaka-video" autoplay="" playsinline="" preload="auto">
        </video>
      </div>
      <div id="jw-container" class="engine-container" aria-label="JW HLS player">
      </div>
      <button id="videoFitBtn" class="video-fit-btn" type="button" aria-label="Change video fit mode" title="Change video fit mode">
        FIT: CONTAIN
      </button>
      <div id="playerMessage" class="player-message" role="status">
      </div>
    </main>
    <script>
      (() =&gt; {
  &#34;use strict&#34;;

  const params = new URLSearchParams(location.search);
  const sourceUrl = params.get(&#34;url&#34;) || params.get(&#34;src&#34;) || params.get(&#34;stream&#34;) || &#34;&#34;;
  const streamName = params.get(&#34;name&#34;) || &#34;&#34;;
  const eventTitle = params.get(&#34;title&#34;) || &#34;&#34;;
  const category = params.get(&#34;category&#34;) || &#34;&#34;;
  const kid = (params.get(&#34;kid&#34;) || params.get(&#34;keyId&#34;) || &#34;&#34;).trim();
  const key = (params.get(&#34;key&#34;) || &#34;&#34;).trim();
  const explicitType = (params.get(&#34;type&#34;) || &#34;&#34;).toLowerCase();

  const shell = document.getElementById(&#34;player-shell&#34;);
  const shakaContainer = document.getElementById(&#34;shaka-container&#34;);
  const jwContainer = document.getElementById(&#34;jw-container&#34;);
  const shakaVideo = document.getElementById(&#34;shaka-video&#34;);
  const fitButton = document.getElementById(&#34;videoFitBtn&#34;);
  const messageEl = document.getElementById(&#34;playerMessage&#34;);

  let shakaPlayer = null;
  let jwPlayer = null;
  let activeEngine = &#34;&#34;;
  let retryCount = 0;
  let retryTimer = null;
  let stopped = false;
  let fitModeIndex = 0;
  let fitButtonHideTimer = null;
  let fitButtonStarted = false;
  const FIT_BUTTON_HIDE_DELAY = 3000;

  function showMessage(message) {
    messageEl.textContent = message;
    messageEl.classList.add(&#34;show&#34;);
  }
  function hideMessage() {
    messageEl.textContent = &#34;&#34;;
    messageEl.classList.remove(&#34;show&#34;);
  }
  function validHttpUrl(value) {
    try {
      const parsed = new URL(value, location.href);
      return [&#34;http:&#34;, &#34;https:&#34;].includes(parsed.protocol) ? parsed.href : &#34;&#34;;
    } catch (_) { return &#34;&#34;; }
  }
  function classifyStream(url) {
    if (explicitType.includes(&#34;hls&#34;)) return &#34;hls&#34;;
    if (explicitType.includes(&#34;dash&#34;) || explicitType.includes(&#34;mpd&#34;)) return &#34;dash&#34;;
    let path = &#34;&#34;;
    try { path = new URL(url).pathname.toLowerCase(); } catch (_) { path = String(url).toLowerCase(); }
    if (/\.m3u8$/i.test(path)) return &#34;hls&#34;;
    if (/\.mpd$/i.test(path)) return &#34;dash&#34;;
    // If the URL has no recognizable extension, honor an optional type parameter;
    // otherwise default to DASH to keep DRM streams on Shaka.
    return &#34;dash&#34;;
  }

  // The same three-mode aspect-ratio / fit function is shared by both engines.
  const fitModes = [
    {key:&#34;contain&#34;, label:&#34;FIT: CONTAIN&#34;, hint:&#34;Original / no crop&#34;},
    {key:&#34;cover&#34;, label:&#34;FULL: COVER&#34;, hint:&#34;Fill screen / crop edges&#34;},
    {key:&#34;stretch&#34;, label:&#34;FULL: STRETCH&#34;, hint:&#34;Fill screen / no black bars&#34;}
  ];

  async function enterPlayerFullscreen() {
    try {
      const active = document.fullscreenElement || document.webkitFullscreenElement;
      if (!active) {
        const target = activeEngine === &#34;hls&#34; ? jwContainer : shakaContainer;
        if (target.requestFullscreen) await target.requestFullscreen({navigationUI:&#34;hide&#34;});
        else if (target.webkitRequestFullscreen) target.webkitRequestFullscreen();
        else if (shakaVideo.webkitEnterFullscreen) shakaVideo.webkitEnterFullscreen();
      }
    } catch (_) {}
    try {
      if (screen.orientation &amp;&amp; screen.orientation.lock) await screen.orientation.lock(&#34;landscape&#34;).catch(()=&gt;{});
    } catch (_) {}
  }

  function applyFitMode(index, requestFullscreen = false) {
    fitModeIndex = (index + fitModes.length) % fitModes.length;
    const mode = fitModes[fitModeIndex];
    [shakaVideo].forEach(el =&gt; {
      el.classList.remove(&#34;fit-contain&#34;,&#34;fit-cover&#34;,&#34;fit-stretch&#34;);
      el.classList.add(&#34;fit-&#34; + mode.key);
    });
    [shakaContainer,jwContainer].forEach(el =&gt; {
      el.classList.remove(&#34;fit-contain&#34;,&#34;fit-cover&#34;,&#34;fit-stretch&#34;,&#34;full-cover&#34;,&#34;full-stretch&#34;);
      el.classList.add(&#34;fit-&#34; + mode.key);
      if (mode.key === &#34;cover&#34;) el.classList.add(&#34;full-cover&#34;);
      if (mode.key === &#34;stretch&#34;) el.classList.add(&#34;full-stretch&#34;);
    });
    fitButton.textContent = mode.label;
    fitButton.title = mode.hint;
    fitButton.setAttribute(&#34;aria-label&#34;, mode.hint);

    const jwVideo = jwContainer.querySelector(&#34;video&#34;);
    if (jwVideo) {
      jwVideo.style.objectFit = mode.key === &#34;cover&#34; ? &#34;cover&#34; : mode.key === &#34;stretch&#34; ? &#34;fill&#34; : &#34;contain&#34;;
      jwVideo.style.objectPosition = &#34;center center&#34;;
    }
    void shakaVideo.offsetWidth;
    if (requestFullscreen &amp;&amp; mode.key !== &#34;contain&#34;) enterPlayerFullscreen();
  }

  fitButton.addEventListener(&#34;click&#34;, ev =&gt; {
    ev.preventDefault();
    ev.stopPropagation();

    // The floating fit button belongs to Shaka only.
    if (activeEngine === &#34;hls&#34;) return;

    const next = fitModeIndex + 1;
    applyFitMode(next, fitModes[(next + fitModes.length) % fitModes.length].key !== &#34;contain&#34;);
    showFitButton();
  });

  function showFitButton() {
    fitButton.classList.remove(&#34;controls-hidden&#34;);
    clearTimeout(fitButtonHideTimer);
    fitButtonHideTimer = setTimeout(() =&gt; fitButton.classList.add(&#34;controls-hidden&#34;), FIT_BUTTON_HIDE_DELAY);
  }
  function startFitButtonAutoHide() {
    if (fitButtonStarted) return;
    fitButtonStarted = true;
    showFitButton();
  }
  shell.addEventListener(&#34;pointerdown&#34;, () =&gt; {
    if (activeEngine === &#34;dash&#34;) showFitButton();
  }, {passive:true});
  shell.addEventListener(&#34;touchstart&#34;, () =&gt; {
    if (activeEngine === &#34;dash&#34;) showFitButton();
  }, {passive:true});
  fitButton.addEventListener(&#34;pointerdown&#34;, ev =&gt; {ev.stopPropagation();if(activeEngine===&#34;dash&#34;)showFitButton();},{passive:true});
  fitButton.addEventListener(&#34;touchstart&#34;, ev =&gt; {ev.stopPropagation();if(activeEngine===&#34;dash&#34;)showFitButton();},{passive:true});
  shakaVideo.addEventListener(&#34;playing&#34;, startFitButtonAutoHide);
  document.addEventListener(&#34;fullscreenchange&#34;, () =&gt; requestAnimationFrame(() =&gt; applyFitMode(fitModeIndex, false)));
  document.addEventListener(&#34;webkitfullscreenchange&#34;, () =&gt; requestAnimationFrame(() =&gt; applyFitMode(fitModeIndex, false)));
  applyFitMode(0);

  function showEngine(engine) {
    activeEngine = engine;
    shakaContainer.style.display = engine === &#34;dash&#34; ? &#34;block&#34; : &#34;none&#34;;
    jwContainer.style.display = engine === &#34;hls&#34; ? &#34;block&#34; : &#34;none&#34;;

    // Top-right button is only for Shaka. JW has its own aspect button near Settings.
    fitButton.style.display = engine === &#34;dash&#34; ? &#34;block&#34; : &#34;none&#34;;
    applyFitMode(fitModeIndex, false);
  }

  function clearJW() {
    clearTimeout(retryTimer);
    if (jwPlayer &amp;&amp; typeof jwPlayer.remove === &#34;function&#34;) {
      try { jwPlayer.remove(); } catch (_) {}
    }
    jwPlayer = null;
    jwContainer.innerHTML = &#34;&#34;;
  }

  function startJW(url) {
    if (stopped) return;
    if (typeof window.jwplayer !== &#34;function&#34;) {
      showMessage(&#34;JW Player library failed to load.&#34;);
      return;
    }
    clearJW();
    showEngine(&#34;hls&#34;);
    jwContainer.innerHTML = &#39;&lt;div id=&#34;jw-hls-instance&#34; style=&#34;position:absolute;inset:0;width:100%;height:100%&#34;&gt;&lt;/div&gt;&#39;;
    jwPlayer = window.jwplayer(&#34;jw-hls-instance&#34;).setup({
      file: url,                 // Direct HLS URL: no PHP proxy
      width: &#34;100%&#34;,
      height: &#34;100%&#34;,
      aspectratio: &#34;16:9&#34;,
      autostart: true,
      mute: true,
      controls: true,
      stretching: &#34;uniform&#34;,
      displaytitle: false,
      displaydescription: false,
      preload: &#34;auto&#34;,
      playbackRateControls: true,
      skin: {name:&#34;seven&#34;}
    });

    // Keep the hybrid player&#39;s shared CONTAIN/COVER/STRETCH fit mode and
    // add a visible JW toolbar button to cycle through those same modes.
    const isPC =
      !/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) &amp;&amp;
      window.matchMedia(&#34;(pointer: fine)&#34;).matches &amp;&amp;
      window.innerWidth &gt; 768;
    const jwModes = [&#34;contain&#34;, &#34;cover&#34;, &#34;stretch&#34;];
    let jwModeIndex = fitModeIndex;

    function syncJWFitMode(index) {
      jwModeIndex = (index + jwModes.length) % jwModes.length;
      // Keep the shared mode state in sync without showing/using Shaka&#39;s top button.
      fitModeIndex = jwModeIndex;
      const mode = jwModes[jwModeIndex];
      jwContainer.classList.remove(&#34;fit-contain&#34;, &#34;fit-cover&#34;, &#34;fit-stretch&#34;, &#34;full-cover&#34;, &#34;full-stretch&#34;);
      jwContainer.classList.add(&#34;fit-&#34; + mode);
      if (mode === &#34;cover&#34;) jwContainer.classList.add(&#34;full-cover&#34;);
      if (mode === &#34;stretch&#34;) jwContainer.classList.add(&#34;full-stretch&#34;);

      const video = jwContainer.querySelector(&#34;video&#34;);
      if (video) {
        video.classList.remove(&#34;fit-contain&#34;, &#34;fit-cover&#34;, &#34;fit-stretch&#34;);
        video.classList.add(&#34;fit-&#34; + mode);
        video.style.objectFit = mode === &#34;cover&#34; ? &#34;cover&#34; : mode === &#34;stretch&#34; ? &#34;fill&#34; : &#34;contain&#34;;
        video.style.objectPosition = &#34;center center&#34;;
      }
    }

    jwPlayer.on(&#34;ready&#34;, () =&gt; {
      if (!jwPlayer || stopped) return;

      try {
        jwPlayer.addButton(
          &#34;https://i.ibb.co/4wPT214r/frame.png&#34;,
          &#34;Aspect Ratio: &#34; + fitModes[jwModeIndex].label,
          () =&gt; {
            syncJWFitMode(jwModeIndex + 1);
          },
          &#34;aspect-button&#34;
        );
      } catch (error) {
        console.warn(&#34;Could not add JW aspect-ratio button:&#34;, error);
      }

      syncJWFitMode(fitModeIndex);
      applyFitMode(fitModeIndex, false);
      startFitButtonAutoHide();
    });

    jwPlayer.on(&#34;play&#34;, () =&gt; {
      retryCount = 0;
      hideMessage();
      startFitButtonAutoHide();
    });
    jwPlayer.on(&#34;firstFrame&#34;, hideMessage);
    jwPlayer.on(&#34;buffer&#34;, () =&gt; showMessage(&#34;Buffering…&#34;));
    jwPlayer.on(&#34;error&#34;, event =&gt; {
      if (stopped) return;
      console.warn(&#34;JW HLS playback error:&#34;, event);
      showMessage(&#34;HLS playback error. Retrying…&#34;);
      if (retryCount &gt;= 3) {
        showMessage(&#34;HLS failed after 3 retries. Check the direct stream URL, CORS and source availability.&#34;);
        return;
      }
      retryCount++;
      clearTimeout(retryTimer);
      retryTimer = setTimeout(() =&gt; {
        if (!stopped) startJW(url);
      }, retryCount * 1500);
    });
  }

  async function startShaka(url) {
    showEngine(&#34;dash&#34;);
    hideMessage();
    if (!window.shaka) throw new Error(&#34;Shaka Player library failed to load.&#34;);
    shaka.polyfill.installAll();
    if (!shaka.Player.isBrowserSupported()) throw new Error(&#34;This browser does not support Shaka Player.&#34;);

    if (shakaPlayer) {
      try { await shakaPlayer.destroy(); } catch (_) {}
      shakaPlayer = null;
    }
    shakaVideo.removeAttribute(&#34;src&#34;);
    shakaVideo.load();

    shakaPlayer = new shaka.Player();
    await shakaPlayer.attach(shakaVideo);
    new shaka.ui.Overlay(shakaPlayer, shakaContainer, shakaVideo);

    const clearKeys = {};
    if (kid &amp;&amp; key) clearKeys[kid.replace(/-/g,&#34;&#34;).toLowerCase()] = key;
    shakaPlayer.configure({
      drm: {clearKeys},
      streaming: {lowLatencyMode:true}
    });

    // Browsers do not allow JavaScript to freely set User-Agent. Referer is also
    // controlled by browser policy; query parameters are accepted but not spoofed.
    shakaPlayer.addEventListener(&#34;error&#34;, event =&gt; {
      const detail = event.detail || event;
      console.warn(&#34;Shaka playback error:&#34;, detail);
    });
    await shakaPlayer.load(url);
    await shakaVideo.play().catch(()=&gt;{});
    applyFitMode(fitModeIndex, false);
    hideMessage();
    startFitButtonAutoHide();
  }

  async function start() {
    if (!sourceUrl) {
      showMessage(&#34;Stream URL missing. Open this page with ?url=STREAM_URL&#34;);
      return;
    }
    const url = validHttpUrl(sourceUrl);
    if (!url) {
      showMessage(&#34;Invalid stream URL. Only HTTP and HTTPS URLs are supported.&#34;);
      return;
    }

    const engine = classifyStream(url);
    if (engine === &#34;hls&#34;) {
      startJW(url);
      return;
    }

    try {
      await startShaka(url);
    } catch (error) {
      console.error(&#34;DASH playback failed:&#34;, error);
      showMessage(&#34;DASH playback failed. Check the stream URL, CORS and DRM key.&#34;);
    }
  }

  window.addEventListener(&#34;pagehide&#34;, async () =&gt; {
    stopped = true;
    clearTimeout(fitButtonHideTimer);
    clearTimeout(retryTimer);
    clearJW();
    if (shakaPlayer) {
      try { await shakaPlayer.destroy(); } catch (_) {}
      shakaPlayer = null;
    }
  }, {once:true});

  // title/category are intentionally optional; no extra overlay is added.
  document.title = [eventTitle || streamName || &#34;SPORTZONE Player&#34;, category].filter(Boolean).join(&#34; · &#34;);
  start();
})();

// ----------------- PC Browser Adblock Detection -----------------
async function detectAdblock() {
  let detected = false;

  // bait div
  const bait = document.createElement(&#34;div&#34;);
  bait.className = &#34;ad adsbox ad-banner adsense ad-container sponsored&#34;;
  bait.style.cssText = &#34;width:1px;height:1px;position:absolute;left:-9999px;top:-9999px;&#34;;
  document.body.appendChild(bait);

  // bait img
  const img = document.createElement(&#34;img&#34;);
  img.src = &#34;https://pagead2.googlesyndication.com/pagead/imgad?id=CAASFeDxyz&#34;;
  img.style.cssText = &#34;width:1px;height:1px;position:absolute;left:-9999px;top:-9999px;&#34;;
  img.onerror = () =&gt; { detected = true; };
  document.body.appendChild(img);

  // bait iframe
  const iframe = document.createElement(&#34;iframe&#34;);
  iframe.src = &#34;https://googleads.g.doubleclick.net/pagead/html/r2023/sample-ad.html&#34;;
  iframe.style.cssText = &#34;width:1px;height:1px;position:absolute;left:-9999px;top:-9999px;&#34;;
  iframe.onerror = () =&gt; { detected = true; };
  document.body.appendChild(iframe);

  // bait script
  const script = document.createElement(&#34;script&#34;);
  script.src = &#34;https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js&#34;;
  script.async = true;
  script.onerror = () =&gt; { detected = true; };
  document.head.appendChild(script);

  await new Promise(resolve =&gt; setTimeout(resolve, 500));

  if (
    window.getComputedStyle(bait).display === &#34;none&#34; ||
    bait.offsetHeight === 0 ||
    bait.offsetParent === null
  ) {
    detected = true;
  }

  bait.remove();
  img.remove();
  iframe.remove();
  script.remove();

  return detected;
}

// ----------------- Brave Shields Detection -----------------
async function detectBraveShields() {
  try {
    let res = await fetch(&#34;https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js&#34;, {
      method: &#34;GET&#34;,
      cache: &#34;no-store&#34;,
      mode: &#34;no-cors&#34;
    });

    if (res.type === &#34;opaque&#34;) {
      try {
        const buf = await res.clone().arrayBuffer();
        console.log(&#34;🟡 Brave Response Size:&#34;, buf.byteLength);

        // Corrected Logic:
        // Size &lt; 100 = Shields OFF
        // Size &gt;= 100 = Shields ON
        if (buf.byteLength &lt; 100) {
          return false; // Shields OFF
        } else {
          return true;  // Shields ON
        }
      } catch (e) {
        console.warn(&#34;🟡 Brave fetch blocked&#34;, e);
        return true; // Shields ON
      }
    }
    return true; // default treat as ON
  } catch (e) {
    console.error(&#34;🛑 Brave Shields hard blocked&#34;, e);
    return true; // Shields ON
  }
}

// ----------------- Main -----------------
window.addEventListener(&#34;load&#34;, async () =&gt; {
  const shieldsOn = await detectBraveShields();
  if (shieldsOn) {
    showPopup(&#34;Brave Shields Detected&#34;);
    return;
  }

  const adblocker = await detectAdblock();
  if (adblocker) {
    showPopup(&#34;Adblock Detected&#34;);
  }
});
