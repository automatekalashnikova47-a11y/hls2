<!-- Adcash library (async so a blocked/slow ad script can never stall the player) -->
<script id="aclib" src="https://acscdn.com/script/aclib.js" async></script>
<script>
  window.addEventListener('load', function () {
    try { if (window.aclib) aclib.runVideoSlider({ zoneId: '12344258' }); } catch (e) {}
  });
  /* Right-click / shortcut protection (cosmetic only) */
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('keydown', function (e) {
    var k = (e.key || '').toLowerCase();
    if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (k === 'i' || k === 'j')) || (e.ctrlKey && k === 'u')) e.preventDefault();
  });
</script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--brand-blue:#4d7cff;--brand-blue-glow:rgba(77,124,255,.6);--bg-dark:#07090e;--text-dim:#9ca3af;--plyr-color-main:#4d7cff;color-scheme:dark}
html,body{width:100%;height:100%;background:var(--bg-dark);overflow:hidden;font-family:'Rajdhani',system-ui,sans-serif;color:#fff;touch-action:manipulation}

.bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);background-size:30px 30px;z-index:0;pointer-events:none;transform:perspective(500px) rotateX(45deg) scale(2);transform-origin:top center;opacity:.35}

/* Screens (fade in/out) */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:10;background:radial-gradient(circle at center,#0c1017 0%,var(--bg-dark) 100%);transition:opacity .5s ease,visibility .5s ease;padding:10px}
.screen.hidden{opacity:0;visibility:hidden;pointer-events:none}
#loader-screen{z-index:50}
#error-screen{z-index:60;background:var(--bg-dark)}
.off{display:none!important}

.brand-title{font-family:'Bebas Neue',Impact,'Arial Narrow',sans-serif;font-size:clamp(32px,6vw,48px);letter-spacing:clamp(3px,.8vw,5px);line-height:1;color:#fff;text-shadow:0 0 20px rgba(255,255,255,.35),0 0 35px rgba(77,124,255,.25);margin-bottom:clamp(10px,2vh,16px)}
.brand-title span{color:#3b82f6;text-shadow:0 0 20px rgba(59,130,246,.6),0 0 40px rgba(59,130,246,.3)}
.dots-container{display:flex;gap:clamp(6px,1.2vw,10px);margin-bottom:clamp(16px,3vh,28px)}
.dot{width:clamp(6px,1vw,8px);height:clamp(6px,1vw,8px);background:#3b82f6;border-radius:50%;opacity:.3;box-shadow:0 0 10px rgba(59,130,246,.8);animation:pulseDot 1.4s infinite ease-in-out both}
.dot:nth-child(1){animation-delay:-.32s}
.dot:nth-child(2){animation-delay:-.16s}
@keyframes pulseDot{0%,80%,100%{transform:scale(.75);opacity:.25}40%{transform:scale(1.15);opacity:.9}}
.subtitle{font-size:clamp(10px,1.8vw,13px);font-weight:600;letter-spacing:clamp(4px,1.2vw,8px);color:#8b9bb4;text-transform:uppercase;margin-bottom:clamp(16px,3vh,28px);padding-left:clamp(4px,1.2vw,8px)}
.status-text{font-size:clamp(9px,1.5vw,11px);font-weight:600;letter-spacing:clamp(3px,1vw,5px);color:#6b7c96;text-transform:uppercase;padding-left:clamp(3px,1vw,5px)}

.lightning-icon{width:clamp(32px,5vw,42px);height:clamp(32px,5vw,42px);fill:#dca952;margin-bottom:16px;filter:drop-shadow(0 0 12px rgba(220,169,82,.3))}
.error-title{font-family:'Bebas Neue',Impact,'Arial Narrow',sans-serif;font-size:clamp(24px,4vw,32px);letter-spacing:2px;margin-bottom:12px}
.error-desc{font-family:'Courier New',Courier,monospace;font-size:clamp(10px,1.5vw,12px);color:var(--text-dim);max-width:min(90vw,340px);line-height:1.5;margin-bottom:20px}
.retry-btn{background:var(--brand-blue);color:#fff;border:none;padding:8px 24px;border-radius:4px;font-family:'Rajdhani',system-ui,sans-serif;font-size:14px;font-weight:700;letter-spacing:1.5px;cursor:pointer;transition:all .2s ease;box-shadow:0 4px 15px rgba(65,105,225,.2)}
.retry-btn:hover{transform:translateY(-2px);background:#5c85ff;box-shadow:0 6px 20px rgba(65,105,225,.35)}
.retry-btn:focus-visible,#custom-fs-btn:focus-visible,#join-btn:focus-visible{outline:2px solid var(--brand-blue);outline-offset:2px}

/* Player */
#player-wrap{width:100%;height:100%;position:relative;background:#000;z-index:5}
video{width:100%;height:100%;display:block}
.plyr{width:100%!important;height:100%!important;position:relative;font-weight:600}
.plyr--video,.plyr__video-wrapper{height:100%!important}
.plyr video{height:100%!important;object-fit:contain}

#join-btn{position:absolute;top:8px;left:8px;z-index:102;color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.3);padding:2px 8px;border-radius:4px;text-decoration:none;font-weight:700;font-size:10px;letter-spacing:1px;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);transition:all .2s}
#join-btn:hover{color:#fff;border-color:#fff;background:rgba(0,0,0,.7)}

#custom-fs-btn{position:absolute;top:8px;right:8px;z-index:103;background:rgba(0,0,0,.65);border:1px solid rgba(65,105,225,.3);color:#fff;width:26px;height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s ease,opacity .3s ease;backdrop-filter:blur(4px)}
#custom-fs-btn:hover{background:rgba(65,105,225,.2);border-color:var(--brand-blue);box-shadow:0 0 8px var(--brand-blue-glow);transform:scale(1.05)}
#custom-fs-btn svg{width:12px;height:12px;stroke:#fff;transition:transform .2s}
#custom-fs-btn:active svg{transform:scale(.9)}
.plyr--hide-controls #custom-fs-btn{opacity:0;pointer-events:none}

#wm{position:absolute;bottom:48px;left:50%;transform:translateX(-50%);z-index:102;pointer-events:none;display:flex;align-items:center;gap:8px;opacity:0;visibility:hidden;transition:opacity .4s ease,visibility .4s ease}
#wm.visible{opacity:.4;visibility:visible}
#wm.visible.dim,.plyr--hide-controls #wm.visible{opacity:.2}
.wm-rule{width:22px;height:1px;background:linear-gradient(90deg,transparent,var(--brand-blue))}
.wm-rule.r{background:linear-gradient(90deg,var(--brand-blue),transparent)}
.wm-inner{display:flex;flex-direction:column;align-items:center;gap:1px}
.wm-name{font-family:'Bebas Neue',Impact,'Arial Narrow',sans-serif;font-size:13px;letter-spacing:3px;color:#fff;text-shadow:0 2px 8px #000}
.wm-name span{color:var(--brand-blue)}
.wm-url{font-size:8px;font-weight:700;letter-spacing:2px;color:rgba(255,255,255,.6);text-transform:uppercase}

@media (prefers-reduced-motion:reduce){.dot{animation:none;opacity:.7}.retry-btn,#custom-fs-btn,.screen{transition:none}}
</style>
</head>
<body>
<noscript>JavaScript is required to play the stream.</noscript>

<div class="bg-grid"></div>

<div id="loader-screen" class="screen">
  <h1 class="brand-title">STREAM<span>47</span></h1>
  <div class="dots-container" aria-hidden="true"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <h2 class="subtitle">LIVE MATCH CENTER</h2>
  <p class="status-text" id="status-text" role="status" aria-live="polite">ESTABLISHING CONNECTION...</p>
</div>

<div id="error-screen" class="screen hidden">
  <svg class="lightning-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <path d="M13 2L3 14H12L11 22L21 10H12L13 2Z" stroke="#dca952" stroke-width="1.5" stroke-linejoin="round"/>
  </svg>
  <h2 class="error-title">STREAM UNAVAILABLE</h2>
  <p class="error-desc" id="error-desc" role="alert">Player did not load. Check if the stream URL is valid, CORS is allowed, and the .m3u8 is reachable.</p>
  <button class="retry-btn" id="retry-btn" type="button">RETRY</button>
</div>

<div id="player-wrap">
  <a id="join-btn" href="https://whatsapp.com/channel/0029VbBcvbn9WtC1onDirp09" target="_blank" rel="noopener noreferrer">JOIN US</a>

  <button id="custom-fs-btn" type="button" title="Toggle fullscreen" aria-label="Toggle fullscreen">
    <svg class="fs-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
    <svg class="fs-exit off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 14h6v6m10-6h-6v6M4 10h6V4m10 6h-6V4"/></svg>
  </button>

  <video id="player" controls playsinline webkit-playsinline x5-playsinline x5-video-player-type="h5" x5-video-player-fullscreen="true"></video>
</div>

<div id="wm" aria-hidden="true">
  <div class="wm-rule"></div>
  <div class="wm-inner"><div class="wm-name">STREAM<span>47</span></div><div class="wm-url">stream-47.blogspot.com</div></div>
  <div class="wm-rule r"></div>
</div>

<script>
(function () {
  'use strict';

  /* Each library is tried from several CDNs, so one blocked CDN no longer kills the player */
  var HLS_URLS = [
    'https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js',
    'https://unpkg.com/hls.js@1.5.13/dist/hls.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js'
  ];
  var PLYR_URLS = [
    'https://cdn.plyr.io/3.7.8/plyr.js',
    'https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.min.js',
    'https://unpkg.com/plyr@3.7.8/dist/plyr.min.js'
  ];
  var MAX_RETRIES = 3;
  var BASE_CONTROLS = ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume'];

  var $ = function (id) { return document.getElementById(id); };
  var video = $('player'), wrap = $('player-wrap'), loader = $('loader-screen'), errorScreen = $('error-screen'),
      statusText = $('status-text'), errorDesc = $('error-desc'), retryBtn = $('retry-btn'),
      wm = $('wm'), fsBtn = $('custom-fs-btn');
  var hls = null, plyr = null, plyrBase = '', wantQ = 0;
  var hardTimeout = 0, retryTimer = 0, wmTimer = 0, netTries = 0, mediaTries = 0;

  /* ---------- Stream URL ---------- */
  // Read the value exactly as typed so nested links (proxy?u=...&token=...) keep their "&", "+" and "%xx".
  function readSrc() {
    var m = location.search.match(/[?&](?:url|stream|get|src|m3u8)=(.*)$/i);
    if (!m) return '';
    var s = m[1].trim();
    if (/^https?%3A/i.test(s)) { try { s = decodeURIComponent(s); } catch (e) {} }
    return s;
  }
  function check(u) {
    var x;
    try { x = new URL(u, location.href); } catch (e) { return 'The stream URL is not valid.'; }
    if (!/^https?:$/.test(x.protocol)) return 'Only http and https stream URLs are supported.';
    if (location.protocol === 'https:' && x.protocol === 'http:') return 'This page is on https, so browsers block http streams. Use an https link.';
    return '';
  }
  var SRC = readSrc();

  /* ---------- Screens ---------- */
  function busy(msg) {
    errorScreen.classList.add('hidden'); loader.classList.remove('hidden');
    wm.classList.remove('visible');
    if (msg) statusText.textContent = msg;
  }
  function ready() {
    clearTimeout(hardTimeout);
    loader.classList.add('hidden'); errorScreen.classList.add('hidden');
    mountOverlays(); wm.classList.add('visible');
  }
  function fail(msg, canRetry) {
    clearTimeout(hardTimeout); clearTimeout(retryTimer);
    if (hls) { hls.destroy(); hls = null; }
    video.pause();
    loader.classList.add('hidden'); errorScreen.classList.remove('hidden');
    wm.classList.remove('visible');
    errorDesc.textContent = msg;
    retryBtn.hidden = canRetry === false;
  }
  function armTimeout() {
    clearTimeout(hardTimeout);
    hardTimeout = setTimeout(function () {
      fail('Connection timed out. Check that the stream URL is valid, CORS is allowed and the .m3u8 is reachable.');
    }, 15000);
  }
  // Move the watermark and fullscreen button inside Plyr so they follow its controls
  function mountOverlays() {
    var p = document.querySelector('.plyr');
    if (!p) return;
    [wm, fsBtn].forEach(function (el) { if (el.parentNode !== p) p.appendChild(el); });
  }
  function tryPlay() {
    var p = video.play();
    // Autoplay blocked: drop the loader so Plyr's big play button is usable
    if (p && p.catch) p.catch(function (e) { if (e && e.name === 'NotAllowedError') ready(); });
  }

  /* ---------- Libraries ---------- */
  function loadAny(urls, global) {
    return new Promise(function (ok, no) {
      var i = 0;
      (function next() {
        if (i >= urls.length) return no(new Error('load failed'));
        var s = document.createElement('script');
        s.src = urls[i++];
        s.onload = function () { window[global] ? ok(s.src) : (s.remove(), next()); };
        s.onerror = function () { s.remove(); next(); };
        document.head.appendChild(s);
      })();
    });
  }
  function needHls() { return window.Hls ? Promise.resolve() : loadAny(HLS_URLS, 'Hls'); }
  function needPlyr() {
    return window.Plyr ? Promise.resolve() : loadAny(PLYR_URLS, 'Plyr').then(function (u) { plyrBase = u.replace(/[^/]+$/, ''); });
  }

  /* ---------- Plyr (optional: native controls remain if it cannot load) ---------- */
  function makePlyr(extra) {
    if (plyr || !window.Plyr) return;
    var opts = { controls: BASE_CONTROLS, fullscreen: { enabled: true, fallback: true, iosNative: true, container: '#player-wrap' } };
    if (plyrBase) opts.iconUrl = plyrBase + 'plyr.svg';
    try { plyr = new Plyr(video, Object.assign(opts, extra)); } catch (e) { plyr = null; }
  }
  function setLevel(v) {
    if (!hls) return;
    v = Number(v) || 0;
    if (!v) { hls.currentLevel = -1; return; }          // 0 = Auto (adaptive)
    var i = hls.levels.findIndex(function (l) { return l.height === v; });
    if (i > -1) hls.currentLevel = i;
  }
  function setupPlyr(levels) {
    if (plyr) return;
    var q = Array.from(new Set(levels.map(function (l) { return l.height; }).filter(function (h) { return h > 0; })))
      .sort(function (a, b) { return b - a; });
    makePlyr(q.length > 1 ? {
      controls: BASE_CONTROLS.concat('settings'),
      settings: ['quality'],
      quality: { default: 0, options: [0].concat(q), forced: true, onChange: function (v) { wantQ = Number(v) || 0; setLevel(wantQ); } },
      i18n: { qualityLabel: { 0: 'Auto' } }
    } : {});
  }

  /* ---------- Playback ---------- */
  function teardown() {
    clearTimeout(hardTimeout); clearTimeout(retryTimer);
    if (hls) { hls.destroy(); hls = null; }
  }
  function startHls() {
    hls = new Hls({ maxBufferLength: 30, backBufferLength: 60, enableWorker: true, lowLatencyMode: false });
    hls.on(Hls.Events.MANIFEST_PARSED, function (_, d) { setupPlyr(d.levels); setLevel(wantQ); tryPlay(); });
    hls.on(Hls.Events.ERROR, function (_, d) { if (d.fatal) onFatal(d); });
    hls.attachMedia(video);
    hls.loadSource(SRC);
  }
  function startNative() { video.src = SRC; makePlyr({}); tryPlay(); }
  function restartHls() { if (hls) { hls.destroy(); hls = null; } startHls(); }

  function onFatal(d) {
    var T = Hls.ErrorTypes;
    if (d.type === T.MEDIA_ERROR && mediaTries < MAX_RETRIES) {
      if (++mediaTries === 2) hls.swapAudioCodec();
      hls.recoverMediaError();
    } else if (d.type === T.NETWORK_ERROR && netTries < MAX_RETRIES) {
      netTries++;
      busy('RECONNECTING... (' + netTries + '/' + MAX_RETRIES + ')');
      armTimeout();
      // Rebuild the player so manifest failures recover too (startLoad() alone cannot)
      retryTimer = setTimeout(restartHls, 1000 * netTries);
    } else {
      fail(explain(d));
    }
  }
  function explain(d) {
    var c = d.response && d.response.code, T = Hls.ErrorTypes;
    if (c === 404) return 'Stream not found (404). The link may have expired or changed.';
    if (c === 401 || c === 403) return 'Access denied (' + c + '). The link may need a token or be restricted.';
    if (c >= 500) return 'The stream server returned an error (' + c + '). Try again shortly.';
    if (d.type === T.NETWORK_ERROR) return 'Stream unreachable. The server may be offline, or it does not allow this site (CORS).';
    if (d.type === T.MEDIA_ERROR) return 'This browser cannot decode the stream (' + d.details + ').';
    return 'Playback failed (' + d.details + ').';
  }

  async function start() {
    teardown(); netTries = mediaTries = 0;
    busy('ESTABLISHING CONNECTION...'); armTimeout();
    await Promise.allSettled([needHls(), needPlyr()]);
    try {
      if (window.Hls && Hls.isSupported()) startHls();
      else if (video.canPlayType('application/vnd.apple.mpegurl')) startNative();
      else fail(window.Hls ? 'Your browser does not support HLS playback.' : 'The player library could not be loaded. Check your connection or ad blocker, then retry.');
    } catch (e) { fail('Player error: ' + e.message); }
  }

  /* ---------- Events ---------- */
  video.addEventListener('playing', function () { netTries = mediaTries = 0; ready(); });
  video.addEventListener('error', function () {
    if (!hls && video.getAttribute('src')) fail('Native playback failed. The stream might be offline or unsupported.');
  });
  retryBtn.addEventListener('click', start);

  // Watermark dims when idle
  function activity() {
    wm.classList.remove('dim'); clearTimeout(wmTimer);
    wmTimer = setTimeout(function () { if (!video.paused) wm.classList.add('dim'); }, 3000);
  }
  ['mousemove', 'touchstart'].forEach(function (t) { document.addEventListener(t, activity, { passive: true }); });
  video.addEventListener('play', activity);
  video.addEventListener('pause', function () { wm.classList.remove('dim'); });

  /* ---------- Fullscreen ---------- */
  function fsEl() { return document.fullscreenElement || document.webkitFullscreenElement; }
  function toggleFs() {
    if (fsEl()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    var req = wrap.requestFullscreen || wrap.webkitRequestFullscreen;
    var native = function () { if (video.webkitEnterFullscreen) video.webkitEnterFullscreen(); };
    if (!req) return native();                     // iPhone: only the video itself can go fullscreen
    var p = req.call(wrap);
    if (p && p.catch) p.catch(native);
  }
  function orient(lock) {
    try {
      var s = screen.orientation; if (!s) return;
      if (lock) { var p = s.lock('landscape'); if (p && p.catch) p.catch(function () {}); } else s.unlock();
    } catch (e) {}
  }
  function onFsChange() {
    var on = !!fsEl();
    fsBtn.querySelector('.fs-enter').classList.toggle('off', on);
    fsBtn.querySelector('.fs-exit').classList.toggle('off', !on);
    orient(on);
  }
  fsBtn.addEventListener('click', toggleFs);
  ['fullscreenchange', 'webkitfullscreenchange'].forEach(function (t) { document.addEventListener(t, onFsChange); });
  video.addEventListener('webkitbeginfullscreen', function () { orient(true); });
  video.addEventListener('webkitendfullscreen', function () { orient(false); });

  /* ---------- Boot ---------- */
  var bad = SRC ? check(SRC) : 'No stream URL provided. Add ?url=<m3u8-link> to the page address.';
  if (bad) fail(bad, false); else start();
})();
</script>
</body>
