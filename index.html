<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style type="text/css">
      * {user-select: auto !important; -webkit-user-select: auto !important;}
    </style>
    <script src="https://cdn.jwplayer.com/libraries/IDzF9Zmk.js">
    </script>
    <style>
      *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#overlay{position:fixed;inset:0;background:#0a0a0a;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
#overlay svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#overlay p{color:#505050;font-size:12px;letter-spacing:.5px;text-align:center;padding:0 24px;font-weight:500}
#pc{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
#player{width:100%;height:100%}
#status{position:fixed;top:max(14px,env(safe-area-inset-top));right:12%;transform:translateY(-10px);z-index:9997;display:flex;align-items:center;gap:7px;padding:6px 15px 6px 11px;background:rgba(10,10,10,.92);border:1px solid rgba(255,255,255,.07);font-size:11.5px;font-weight:500;letter-spacing:.2px;border-radius:24px;pointer-events:none;opacity:0;transition:opacity .25s ease,transform .25s ease;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;box-shadow:0 2px 14px rgba(0,0,0,.45)}
#status.show{opacity:1;transform:translateY(0)}
.st-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block}
#status.ok{color:#c0c0c0}
#status.ok .st-dot{background:#60a5fa}
#status.live{color:#c8c8c8}
#status.live .st-dot{background:#22d3a0;animation:dot-pulse 2s ease-in-out infinite}
#status.warn{color:#fcd34d}
#status.warn .st-dot{background:#fb923c;animation:dot-pulse 1s ease-in-out infinite}
#status.err{color:#fca5a5}
#status.err .st-dot{background:#f87171}
@keyframes dot-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.55)}}
    </style>
  </head>
  <body>
    <div id="overlay">
      <svg width="34" height="34" viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="16" stroke="#1a1a1a" stroke-width="4">
        </circle>
        <path d="M20 4a16 16 0 0 1 16 16" stroke="#38bdf8" stroke-width="4" stroke-linecap="round">
        </path>
      </svg>
      <p id="loadMsg">
        Missing or invalid ?url= parameter
      </p>
    </div>
    <div id="status" class="show err">
      <span class="st-dot"></span>
      <span>      Missing or invalid stream URL.
</span>
    </div>
    <div id="pc">
      <div id="player">
      </div>
    </div>
    <script>
      (function(){
&#34;use strict&#34;;
var $overlay = document.getElementById(&#34;overlay&#34;);
var $loadMsg = document.getElementById(&#34;loadMsg&#34;);
var $status  = document.getElementById(&#34;status&#34;);
var _stTmr = null;

function getStreamUrl(){
  var params = new URLSearchParams(window.location.search);
  var urlParam = params.get(&#34;url&#34;);
  if(!urlParam) return null;
  try{
    return decodeURIComponent(urlParam);
  }catch(e){
    return null;
  }
}

function toast(msg, type, dur){
  $status.innerHTML = &#39;&lt;span class=&#34;st-dot&#34;&gt;&lt;/span&gt;&lt;span&gt;&#39; + msg + &#39;&lt;/span&gt;&#39;;
  $status.className = &#34;show &#34; + (type || &#34;ok&#34;);
  if(_stTmr){
    clearTimeout(_stTmr);
    _stTmr = null;
  }
  if(dur !== 0){
    _stTmr = setTimeout(function(){
      $status.className = $status.className.replace(&#34;show&#34;,&#34;&#34;).trim();
      _stTmr = null;
    }, dur || 4000);
  }
}

function setMsg(m){
  if($loadMsg) $loadMsg.textContent = m;
}

function hideOverlay(){
  if($overlay) $overlay.style.display = &#34;none&#34;;
}

function startPlayer(){
  var streamUrl = getStreamUrl();
  if(!streamUrl){
    setMsg(&#34;Missing or invalid ?url= parameter&#34;);
    toast(&#34;Missing or invalid stream URL.&#34;, &#34;err&#34;, 0);
    return;
  }

  setMsg(&#34;Loading Stream…&#34;);
  toast(&#34;Loading Stream…&#34;, &#34;warn&#34;, 0);

  var playerInstance = jwplayer(&#34;player&#34;);

  playerInstance.setup({
    file: streamUrl,
    autostart: true,
    mute: true,
    primary: &#34;html5&#34;,
    hlshtml: true,
    width: &#34;100%&#34;,
    height: &#34;100%&#34;,
    crossorigin: &#34;anonymous&#34;
  });

  playerInstance.on(&#34;ready&#34;, function(){
    hideOverlay();
    toast(&#34;Ready — Tap ▶ To Play&#34;, &#34;ok&#34;, 5000);
  });

  playerInstance.on(&#34;play&#34;, function(){
    toast(&#34;Live&#34;, &#34;live&#34;, 3000);
  });

  playerInstance.on(&#34;buffer&#34;, function(){
    toast(&#34;Buffering…&#34;, &#34;warn&#34;, 0);
  });

  playerInstance.on(&#34;error&#34;, function(e){
    console.error(&#34;JWPlayer Error:&#34;, e);
    toast(&#34;Stream Blocked or CORS Error&#34;, &#34;err&#34;, 6000);
  });
}

document.addEventListener(&#34;DOMContentLoaded&#34;, startPlayer);
})();
    </script>
  </body>
</html>
