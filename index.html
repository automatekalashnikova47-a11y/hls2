<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#4d7cff;--glow:rgba(77,124,255,.6);--bg:#07090e;--dim:#9ca3af;--plyr-color-main:#4d7cff;color-scheme:dark}
html,body{height:100%;background:var(--bg);color:#fff;font-family:'Rajdhani',system-ui,sans-serif;touch-action:manipulation}
.off{display:none!important}
.s47-root{position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden}
.s47-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);background-size:30px 30px;pointer-events:none;transform:perspective(500px) rotateX(45deg) scale(2);transform-origin:top center;opacity:.35}

/* Player */
.s47-wrap{position:absolute;inset:0;background:#000;z-index:5}
.s47-wrap video{width:100%;height:100%;display:block}
.plyr{width:100%!important;height:100%!important;font-weight:600}
.plyr--video,.plyr__video-wrapper{height:100%!important}
.plyr video{height:100%!important;object-fit:contain}

.s47-join{position:absolute;top:8px;left:8px;z-index:102;color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.3);padding:2px 8px;border-radius:4px;text-decoration:none;font-weight:700;font-size:10px;letter-spacing:1px;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);transition:all .2s}
.s47-join:hover{color:#fff;border-color:#fff;background:rgba(0,0,0,.7)}
.s47-fs{position:absolute;top:8px;right:8px;z-index:103;width:26px;height:26px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.65);border:1px solid rgba(65,105,225,.3);color:#fff;border-radius:4px;cursor:pointer;backdrop-filter:blur(4px);transition:all .2s ease,opacity .3s ease}
.s47-fs:hover{background:rgba(65,105,225,.2);border-color:var(--blue);box-shadow:0 0 8px var(--glow);transform:scale(1.05)}
.s47-fs svg{width:12px;height:12px;stroke:#fff}
.s47-fs[data-idle="true"]{opacity:0;pointer-events:none}
.s47-join:focus-visible,.s47-fs:focus-visible,.s47-retry:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.s47-wm{position:absolute;bottom:48px;left:50%;transform:translateX(-50%);z-index:102;pointer-events:none;display:flex;align-items:center;gap:8px;opacity:0;visibility:hidden;transition:opacity .4s ease,visibility .4s ease}
.s47-wm[data-visible="true"]{opacity:.4;visibility:visible}
.s47-wm[data-visible="true"][data-idle="true"]{opacity:.2}
.s47-wm-rule{width:22px;height:1px;background:linear-gradient(90deg,transparent,var(--blue))}
.s47-wm-rule.r{background:linear-gradient(90deg,var(--blue),transparent)}
.s47-wm-inner{display:flex;flex-direction:column;align-items:center;gap:1px}
.s47-wm-name{font-family:'Bebas Neue',Impact,'Arial Narrow',sans-serif;font-size:13px;letter-spacing:3px;color:#fff;text-shadow:0 2px 8px #000}
.s47-wm-name span{color:var(--blue)}
.s47-wm-url{font-size:8px;font-weight:700;letter-spacing:2px;color:rgba(255,255,255,.6);text-transform:uppercase}

/* Loader + error screens */
.s47-screen{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;background:radial-gradient(circle at center,#0c1017 0%,var(--bg) 100%);transition:opacity .5s ease,visibility .5s ease}
.s47-screen-solid{z-index:60;background:var(--bg)}
.s47-screen[data-hidden="true"]{opacity:0;visibility:hidden;pointer-events:none}
.s47-brand{font-family:'Bebas Neue',Impact,'Arial Narrow',sans-serif;font-size:clamp(32px,6vw,48px);letter-spacing:clamp(3px,.8vw,5px);line-height:1;text-shadow:0 0 20px rgba(255,255,255,.35),0 0 35px rgba(77,124,255,.25);margin-bottom:clamp(10px,2vh,16px)}
.s47-brand span{color:#3b82f6;text-shadow:0 0 20px rgba(59,130,246,.6),0 0 40px rgba(59,130,246,.3)}
.s47-dots{display:flex;gap:clamp(6px,1.2vw,10px);margin-bottom:clamp(16px,3vh,28px)}
.s47-dot{width:clamp(6px,1vw,8px);height:clamp(6px,1vw,8px);background:#3b82f6;border-radius:50%;opacity:.3;box-shadow:0 0 10px rgba(59,130,246,.8);animation:pulse 1.4s infinite ease-in-out both}
.s47-dot:nth-child(1){animation-delay:-.32s}
.s47-dot:nth-child(2){animation-delay:-.16s}
@keyframes pulse{0%,80%,100%{transform:scale(.75);opacity:.25}40%{transform:scale(1.15);opacity:.9}}
.s47-subtitle{font-size:clamp(10px,1.8vw,13px);font-weight:600;letter-spacing:clamp(4px,1.2vw,8px);color:#8b9bb4;text-transform:uppercase;margin-bottom:clamp(16px,3vh,28px);padding-left:clamp(4px,1.2vw,8px)}
.s47-status{font-size:clamp(9px,1.5vw,11px);font-weight:600;letter-spacing:clamp(3px,1vw,5px);color:#6b7c96;text-transform:uppercase;padding-left:clamp(3px,1vw,5px)}
.s47-bolt{width:clamp(32px,5vw,42px);height:clamp(32px,5vw,42px);fill:none;stroke:#dca952;margin-bottom:16px;filter:drop-shadow(0 0 12px rgba(220,169,82,.3))}
.s47-error-title{font-family:'Bebas Neue',Impact,'Arial Narrow',sans-serif;font-size:clamp(24px,4vw,32px);letter-spacing:2px;margin-bottom:12px}
.s47-error-desc{font-family:'Courier New',Courier,monospace;font-size:clamp(10px,1.5vw,12px);color:var(--dim);max-width:min(90vw,340px);line-height:1.5;margin-bottom:20px}
.s47-retry{background:var(--blue);color:#fff;border:0;padding:8px 24px;border-radius:4px;font:700 14px 'Rajdhani',system-ui,sans-serif;letter-spacing:1.5px;cursor:pointer;transition:all .2s ease;box-shadow:0 4px 15px rgba(65,105,225,.2)}
.s47-retry:hover{transform:translateY(-2px);background:#5c85ff;box-shadow:0 6px 20px rgba(65,105,225,.35)}
@media (prefers-reduced-motion:reduce){.s47-dot{animation:none;opacity:.7}.s47-screen,.s47-fs,.s47-retry{transition:none}}
</style>

<body>
<noscript>JavaScript is required to play the stream.</noscript>
<div class="s47-root">
  <div class="s47-grid"></div>

  <div class="s47-wrap">

    </button>
    <video id="player" controls playsinline webkit-playsinline x5-playsinline x5-video-player-type="h5" x5-video-player-fullscreen="true"></video>
    <div class="s47-wm" data-visible="false" data-idle="false" aria-hidden="true">
      <div class="s47-wm-rule"></div>
      <div class="s47-wm-inner"><div class="s47-wm-name">STREAM<span>47</span></div><div class="s47-wm-url">stream-47.blogspot.com</div></div>
      <div class="s47-wm-rule r"></div>

  </div>

  <div class="s47-screen" id="s47-loader" data-hidden="false">
    <h1 class="s47-brand">STREAM<span>47</span></h1>
    <div class="s47-dots" aria-hidden="true"><div class="s47-dot"></div><div class="s47-dot"></div><div class="s47-dot"></div></div>
    <h2 class="s47-subtitle">LIVE MATCH CENTER</h2>
    <p class="s47-status" id="s47-status" role="status" aria-live="polite">ESTABLISHING CONNECTION...</p>
  </div>

  <div class="s47-screen s47-screen-solid" id="s47-error" data-hidden="true">
    <svg class="s47-bolt" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><path d="M13 2L3 14H12L11 22L21 10H12L13 2Z" stroke-width="1.5" stroke-linejoin="round"/></svg>
    <h2 class="s47-error-title">STREAM UNAVAILABLE</h2>
    <p class="s47-error-desc" id="s47-error-desc" role="alert">Player did not load. Check if the stream URL is valid, CORS is allowed, and the .m3u8 is reachable.</p>
    <button class="s47-retry" id="s47-retry" type="button">RETRY</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var CONFIG = {
    AD_ZONE: '',     // Adcash zone id, e.g. '12344258'. Empty = no ads (the Lovable page loaded none).
    LOCK_UI: true    // block right-click and devtools shortcuts (cosmetic only)
  };
  var HLS_URLS = [
    'https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js',
    'https://unpkg.com/hls.js@1.5.13/dist/hls.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js'
  ];
  var PLYR_URLS = [
    'https://cdn.plyr.io/3.7.8/plyr.js',
    'https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.min.js',
    'https://unpkg.com/plyr@3.7.8/dist/plyr.min.js'
  ];
  var MAX_RETRIES = 3;
  var BASE_CONTROLS = ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume'];

  var $ = function (id) { return document.getElementById(id); };
  var video = $('player'), wrap = document.querySelector('.s47-wrap'), loader = $('s47-loader'), errorScreen = $('s47-error'),
      statusText = $('s47-status'), errorDesc = $('s47-error-desc'), retryBtn = $('s47-retry'),
      wm = document.querySelector('.s47-wm'), fsBtn = document.querySelector('.s47-fs');
  var hls = null, plyr = null, plyrBase = '', wantQ = 0;
  var hardTimeout = 0, retryTimer = 0, idleTimer = 0, netTries = 0, mediaTries = 0;
  var flag = function (el, k, v) { el.dataset[k] = v ? 'true' : 'false'; };

  /* Optional extras */
  if (CONFIG.LOCK_UI) {
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    document.addEventListener('keydown', function (e) {
      var k = (e.key || '').toLowerCase();
      if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (k === 'i' || k === 'j')) || (e.ctrlKey && k === 'u')) e.preventDefault();
    });
  }
  if (CONFIG.AD_ZONE) {
    var ad = document.createElement('script');
    ad.id = 'aclib'; ad.async = true; ad.src = 'https://acscdn.com/script/aclib.js';
    ad.onload = function () { try { aclib.runVideoSlider({ zoneId: CONFIG.AD_ZONE }); } catch (e) {} };
    document.head.appendChild(ad);
  }

  /* ---------- Stream URL (read as typed: keeps "&", "+" and "%xx" of nested proxy links) ---------- */
  function readSrc() {
    var m = location.search.match(/[?&](?:url|stream|get|src|m3u8)=(.*)$/i);
    if (!m) return '';
    var s = m[1].trim();
    if (/^https?%3A/i.test(s)) { try { s = decodeURIComponent(s); } catch (e) {} }
    return s;
  }
  function check(u) {
    var x;
    try { x = new URL(u, location.href); } catch (e) { return 'The stream URL is not valid.'; }
    if (!/^https?:$/.test(x.protocol)) return 'Only http and https stream URLs are supported.';
    if (location.protocol === 'https:' && x.protocol === 'http:') return 'This page is on https, so browsers block http streams. Use an https link.';
    return '';
  }
  var SRC = readSrc();

  /* ---------- Screens ---------- */
  function busy(msg) {
    flag(errorScreen, 'hidden', true); flag(loader, 'hidden', false); flag(wm, 'visible', false);
    if (msg) statusText.textContent = msg;
  }
  function ready() {
    clearTimeout(hardTimeout);
    flag(loader, 'hidden', true); flag(errorScreen, 'hidden', true); flag(wm, 'visible', true);
    poke();
  }
  function fail(msg, canRetry) {
    clearTimeout(hardTimeout); clearTimeout(retryTimer);
    if (hls) { hls.destroy(); hls = null; }
    video.pause();
    flag(loader, 'hidden', true); flag(errorScreen, 'hidden', false); flag(wm, 'visible', false);
    errorDesc.textContent = msg;
    retryBtn.hidden = canRetry === false;
  }
  function armTimeout() {
    clearTimeout(hardTimeout);
    hardTimeout = setTimeout(function () {
      fail('Connection timed out. Check that the stream URL is valid, CORS is allowed and the .m3u8 is reachable.');
    }, 15000);
  }
  function tryPlay() {
    var p = video.play();
    if (p && p.catch) p.catch(function (e) { if (e && e.name === 'NotAllowedError') ready(); }); // autoplay blocked: show Plyr's play button
  }

  /* ---------- Idle: fullscreen button + watermark fade with the controls ---------- */
  function setIdle(v) { flag(fsBtn, 'idle', v); flag(wm, 'idle', v); }
  function poke() {
    setIdle(false); clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { if (!video.paused) setIdle(true); }, 3000);
  }
  ['mousemove', 'touchstart', 'keydown'].forEach(function (t) { document.addEventListener(t, poke, { passive: true }); });
  video.addEventListener('play', poke);
  video.addEventListener('pause', function () { clearTimeout(idleTimer); setIdle(false); });

  /* ---------- Libraries (each tried from several CDNs) ---------- */
  function loadAny(urls, global) {
    return new Promise(function (ok, no) {
      var i = 0;
      (function next() {
        if (i >= urls.length) return no(new Error('load failed'));
        var s = document.createElement('script');
        s.src = urls[i++];
        s.onload = function () { window[global] ? ok(s.src) : (s.remove(), next()); };
        s.onerror = function () { s.remove(); next(); };
        document.head.appendChild(s);
      })();
    });
  }
  function needHls() { return window.Hls ? Promise.resolve() : loadAny(HLS_URLS, 'Hls'); }
  function needPlyr() {
    return window.Plyr ? Promise.resolve() : loadAny(PLYR_URLS, 'Plyr').then(function (u) { plyrBase = u.replace(/[^/]+$/, ''); });
  }

  /* ---------- Plyr (optional: native controls remain if it cannot load) ---------- */
  function makePlyr(extra) {
    if (plyr || !window.Plyr) return;
    var opts = { controls: BASE_CONTROLS, fullscreen: { enabled: true, fallback: true, iosNative: true, container: '.s47-wrap' } };
    if (plyrBase) opts.iconUrl = plyrBase + 'plyr.svg';
    try { plyr = new Plyr(video, Object.assign(opts, extra)); } catch (e) { plyr = null; }
  }
  function setLevel(v) {
    if (!hls) return;
    v = Number(v) || 0;
    if (!v) { hls.currentLevel = -1; return; }                // 0 = Auto (adaptive)
    var i = hls.levels.findIndex(function (l) { return l.height === v; });
    if (i > -1) hls.currentLevel = i;
  }
  function setupPlyr(levels) {
    if (plyr) return;
    var q = Array.from(new Set(levels.map(function (l) { return l.height; }).filter(function (h) { return h > 0; })))
      .sort(function (a, b) { return b - a; });
    makePlyr(q.length > 1 ? {
      controls: BASE_CONTROLS.concat('settings'),
      settings: ['quality'],
      quality: { default: 0, options: [0].concat(q), forced: true, onChange: function (v) { wantQ = Number(v) || 0; setLevel(wantQ); } },
      i18n: { qualityLabel: { 0: 'Auto' } }
    } : {});
  }

  /* ---------- Playback ---------- */
  function teardown() {
    clearTimeout(hardTimeout); clearTimeout(retryTimer);
    if (hls) { hls.destroy(); hls = null; }
  }
  function startHls() {
    hls = new Hls({ maxBufferLength: 30, backBufferLength: 60, enableWorker: true, lowLatencyMode: false });
    hls.on(Hls.Events.MANIFEST_PARSED, function (_, d) { setupPlyr(d.levels); setLevel(wantQ); tryPlay(); });
    hls.on(Hls.Events.ERROR, function (_, d) { if (d.fatal) onFatal(d); });
    hls.attachMedia(video);
    hls.loadSource(SRC);
  }
  function startNative() { video.src = SRC; makePlyr({}); tryPlay(); }
  function restartHls() { if (hls) { hls.destroy(); hls = null; } startHls(); }

  function onFatal(d) {
    var T = Hls.ErrorTypes;
    if (d.type === T.MEDIA_ERROR && mediaTries < MAX_RETRIES) {
      if (++mediaTries === 2) hls.swapAudioCodec();
      hls.recoverMediaError();
    } else if (d.type === T.NETWORK_ERROR && netTries < MAX_RETRIES) {
      netTries++;
      busy('RECONNECTING... (' + netTries + '/' + MAX_RETRIES + ')');
      armTimeout();
      retryTimer = setTimeout(restartHls, 1000 * netTries);   // rebuild so manifest failures recover too
    } else {
      fail(explain(d));
    }
  }
  function explain(d) {
    var c = d.response && d.response.code, T = Hls.ErrorTypes;
    if (c === 404) return 'Stream not found (404). The link may have expired or changed.';
    if (c === 401 || c === 403) return 'Access denied (' + c + '). The link may need a token or be restricted.';
    if (c >= 500) return 'The stream server returned an error (' + c + '). Try again shortly.';
    if (d.type === T.NETWORK_ERROR) return 'Stream unreachable. The server may be offline, or it does not allow this site (CORS).';
    if (d.type === T.MEDIA_ERROR) return 'This browser cannot decode the stream (' + d.details + ').';
    return 'Playback failed (' + d.details + ').';
  }

  async function start() {
    teardown(); netTries = mediaTries = 0;
    busy('ESTABLISHING CONNECTION...'); armTimeout();
    await Promise.allSettled([needHls(), needPlyr()]);
    try {
      if (window.Hls && Hls.isSupported()) startHls();
      else if (video.canPlayType('application/vnd.apple.mpegurl')) startNative();
      else fail(window.Hls ? 'Your browser does not support HLS playback.' : 'The player library could not be loaded. Check your connection or ad blocker, then retry.');
    } catch (e) { fail('Player error: ' + e.message); }
  }

  video.addEventListener('playing', function () { netTries = mediaTries = 0; ready(); });
  video.addEventListener('error', function () {
    if (!hls && video.getAttribute('src')) fail('Native playback failed. The stream might be offline or unsupported.');
  });
  retryBtn.addEventListener('click', start);

  /* ---------- Fullscreen ---------- */
  function fsEl() { return document.fullscreenElement || document.webkitFullscreenElement; }
  function toggleFs() {
    if (fsEl()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    var req = wrap.requestFullscreen || wrap.webkitRequestFullscreen;
    var native = function () { if (video.webkitEnterFullscreen) video.webkitEnterFullscreen(); };
    if (!req) return native();                      // iPhone: only the video itself can go fullscreen
    var p = req.call(wrap);
    if (p && p.catch) p.catch(native);
  }
  function orient(lock) {
    try {
      var s = screen.orientation; if (!s) return;
      if (lock) { var p = s.lock('landscape'); if (p && p.catch) p.catch(function () {}); } else s.unlock();
    } catch (e) {}
  }
  function onFsChange() {
    var on = !!fsEl();
    fsBtn.querySelector('.fs-enter').classList.toggle('off', on);
    fsBtn.querySelector('.fs-exit').classList.toggle('off', !on);
    fsBtn.setAttribute('aria-label', on ? 'Exit fullscreen' : 'Enter fullscreen');
    orient(on);
  }
  fsBtn.addEventListener('click', toggleFs);
  ['fullscreenchange', 'webkitfullscreenchange'].forEach(function (t) { document.addEventListener(t, onFsChange); });
  video.addEventListener('webkitbeginfullscreen', function () { orient(true); });
  video.addEventListener('webkitendfullscreen', function () { orient(false); });

  /* ---------- Boot ---------- */
  var bad = SRC ? check(SRC) : 'No stream URL provided. Add ?url=<m3u8-link> to the page address.';
  if (bad) fail(bad, false); else start();
})();
</script>
